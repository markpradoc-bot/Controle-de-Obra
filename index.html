<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Obra — financeiro, suprimentos e diario de obra</title>
<meta name="description" content="Sistema de acompanhamento de obra: avanco fisico, Gantt semanal editavel, orcamento, contratos, atrasos, equipes, materiais e relatorios.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230F1F2E'/%3E%3Crect x='5' y='19' width='22' height='4' fill='%23D1560A'/%3E%3Crect x='5' y='12' width='14' height='4' fill='%23FFFFFF'/%3E%3Crect x='5' y='5' width='8' height='4' fill='%23FFFFFF'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#EDF1F5}
button{font:inherit}
input,select,textarea{font:inherit}
.flex{display:flex}.flex-1{flex:1 1 0%}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
.grid{display:grid}
.gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-6{gap:1.5rem}
.items-center{align-items:center}.items-end{align-items:flex-end}
.justify-between{justify-content:space-between}.justify-end{justify-content:flex-end}
.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
.mt-1{margin-top:.25rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}
#boot{font:14px ui-sans-serif,system-ui,sans-serif;color:#6B7C8B;padding:40px}
@media (max-width:760px){
  .app-shell{flex-direction:column !important}
  .app-shell > aside{position:static !important;width:100% !important;height:auto !important}
  .app-shell > main{padding:12px !important}
}
</style>
</head>
<body>
<script>
/* Rede de segurança: navegadores muito antigos sem ResizeObserver não
   quebram a tela — os gráficos apenas usam uma largura padrão. */
if (typeof ResizeObserver === "undefined") {
  window.ResizeObserver = function (cb) {
    this.observe = function (el) {
      var w = (el && el.clientWidth) || 800, h = (el && el.clientHeight) || 260;
      setTimeout(function () { cb([{ contentRect: { width: w, height: h } }]); }, 0);
    };
    this.unobserve = function () {}; this.disconnect = function () {};
  };
}
</script>
<div id="root"><div id="boot">Carregando o sistema…</div></div>
<script>
/* ---------------------------------------------------------------------------
   Base oficial da obra.
   Antes de iniciar o sistema, este trecho procura o arquivo dados.json que
   está publicado ao lado do index.html:
     - quem abre pela primeira vez já entra com a obra carregada;
     - quem já tem dados no navegador recebe um aviso quando há base nova.
   Sem o dados.json (ou abrindo o arquivo direto do computador), o sistema
   funciona normalmente só com o armazenamento do navegador.
--------------------------------------------------------------------------- */
(function () {
  var CHAVE = "obra2:estado";
  var CHAVE_VERSAO = "obra2:versaoPublicada";

  function ler(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function gravar(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }

  function iniciarSistema() {
    var s = document.createElement("script");
    s.src = "app.js";
    document.body.appendChild(s);
  }

  function barraAviso(estado, versao) {
    var bar = document.createElement("div");
    bar.className = "no-print";
    bar.setAttribute("style",
      "position:fixed;left:0;right:0;bottom:0;z-index:95;background:#FAF0D4;" +
      "border-top:3px solid #B8860B;padding:12px 16px;display:flex;flex-wrap:wrap;" +
      "align-items:center;justify-content:center;gap:12px;font:12.5px/1.5 ui-sans-serif,system-ui,sans-serif;" +
      "color:#2B3E4F;box-shadow:0 -6px 24px rgba(15,31,46,.18)");

    var txt = document.createElement("span");
    txt.innerHTML = "<strong>H&aacute; uma vers&atilde;o mais recente publicada desta obra.</strong> " +
      "Carregar substitui o que est&aacute; neste navegador pela base oficial.";

    var btnCarregar = document.createElement("button");
    btnCarregar.textContent = "Carregar a vers\u00e3o publicada";
    btnCarregar.setAttribute("style",
      "background:#12457A;color:#fff;border:1px solid #12457A;border-radius:2px;" +
      "padding:7px 13px;font:600 12px ui-sans-serif,system-ui,sans-serif;cursor:pointer");
    btnCarregar.onclick = function () {
      gravar(CHAVE, JSON.stringify(estado));
      gravar(CHAVE_VERSAO, versao);
      window.location.reload();
    };

    var btnManter = document.createElement("button");
    btnManter.textContent = "Manter os meus dados";
    btnManter.setAttribute("style",
      "background:#fff;color:#2B3E4F;border:1px solid #D2DBE3;border-radius:2px;" +
      "padding:7px 13px;font:600 12px ui-sans-serif,system-ui,sans-serif;cursor:pointer");
    btnManter.onclick = function () {
      gravar(CHAVE_VERSAO, versao);
      bar.remove();
    };

    bar.appendChild(txt);
    bar.appendChild(btnCarregar);
    bar.appendChild(btnManter);
    document.body.appendChild(bar);
  }

  function seguir(estado, versao) {
    if (estado) {
      if (!ler(CHAVE)) {
        gravar(CHAVE, JSON.stringify(estado));
        gravar(CHAVE_VERSAO, versao);
      } else if (versao && ler(CHAVE_VERSAO) !== versao) {
        setTimeout(function () { barraAviso(estado, versao); }, 1200);
      }
    }
    iniciarSistema();
  }

  try {
    fetch("dados.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("sem dados.json");
        var versao = r.headers.get("etag") || r.headers.get("last-modified") || "";
        return r.json().then(function (corpo) {
          /* aceita os dois formatos: o arquivo de publicacao
             ({ publicadoEm, estado }) e o backup exportado pelo sistema */
          var estado = corpo && corpo.estado ? corpo.estado : corpo;
          if (!estado || !Array.isArray(estado.tasks)) throw new Error("formato nao reconhecido");
          if (corpo && corpo.publicadoEm) versao = corpo.publicadoEm;
          if (!versao) versao = "tamanho:" + JSON.stringify(estado).length;
          seguir(estado, versao);
        });
      })
      .catch(function () { seguir(null, ""); });
  } catch (e) {
    seguir(null, "");
  }
})();
</script>
</body>
</html>
